name: Fix article TOC and deploy Hugo site

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  fix-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch TOC positioning
        shell: bash
        run: |
          set -Eeuo pipefail
          css_file="$(find . -path '*/themes/gilded-page/static/css/refinements.css' -type f -print -quit)"
          if [[ -z "$css_file" ]]; then
            echo "Could not find themes/gilded-page/static/css/refinements.css" >&2
            exit 1
          fi
          export TOC_CSS_FILE="$css_file"
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["TOC_CSS_FILE"])
          css = path.read_text()
          old_marker = "/* Keep the article outline in view on desktop without covering the article. */"
          if old_marker in css:
              css = css.split(old_marker, 1)[0].rstrip() + "\n"

          marker = "/* TOC follows only within the article body, starting below its image. */"
          if marker not in css:
              css += """

          /* TOC follows only within the article body, starting below its image. */
          @media (min-width: 992px) {
            .article-wrap > .row {
              display: flex !important;
              align-items: stretch !important;
            }
            .article-wrap > .row > aside {
              position: static !important;
              inset: auto !important;
              width: 25% !important;
              max-width: 25% !important;
              margin: 0 !important;
            }
            .article-wrap .toc-card {
              position: sticky !important;
              top: 104px !important;
              bottom: auto !important;
              inset: auto !important;
              transform: none !important;
              display: flex;
              flex-direction: column;
              min-height: 0;
              max-height: calc(100vh - 124px);
              overflow: hidden;
            }
            .article-wrap #article-toc {
              min-height: 0;
              overflow-y: auto;
              overscroll-behavior: contain;
              scrollbar-width: thin;
            }
            .article-wrap .article-body {
              width: 66.666667% !important;
              max-width: 66.666667% !important;
              flex: 0 0 66.666667% !important;
              margin-left: 0 !important;
              margin-right: 0 !important;
            }
          }
          @media (max-width: 991.98px) {
            .article-wrap > .row {
              display: flex !important;
              align-items: flex-start !important;
            }
            .article-wrap > .row > aside {
              position: static !important;
              width: 100% !important;
              max-width: 100% !important;
            }
            .article-wrap .toc-card {
              position: relative !important;
              top: auto !important;
              max-height: none;
            }
            .article-wrap #article-toc {
              max-height: min(34vh, 270px);
              overflow-y: auto;
            }
            .article-wrap .article-body {
              width: 100% !important;
              max-width: 100% !important;
              flex: 0 0 100% !important;
              margin-left: 0 !important;
            }
          }
          """
          path.write_text(css)
          print(f"Patched {path}")
          PY

      - name: Commit TOC fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Fix sticky article table of contents'
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "TOC fix is already present."
          fi

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          HUGO_VERSION=0.168.0
          curl -fsSLo "$RUNNER_TEMP/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Build Hugo site
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/" --destination ./dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist


  deploy:
    runs-on: ubuntu-latest
    needs: fix-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
