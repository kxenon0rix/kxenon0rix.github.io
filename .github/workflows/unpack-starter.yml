name: One-time unzip Hugo starter

on:
  workflow_dispatch:
    inputs:
      archive_path:
        description: ZIP file path in the repository root
        required: true
        default: Gilded-Page-Hugo-GitHub-Lazy-Pack.zip

permissions:
  contents: read

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOOTSTRAP_TOKEN }}
          persist-credentials: true

      - name: Clear repository and install site from ZIP
        env:
          ARCHIVE_PATH: ${{ inputs.archive_path }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$ARCHIVE_PATH" =~ ^[A-Za-z0-9_.-]+\.zip$ ]]; then
            echo "archive_path must be a ZIP file in the repository root" >&2
            exit 1
          fi

          [[ -f "$GITHUB_WORKSPACE/$ARCHIVE_PATH" ]] || {
            echo "ZIP not found: $ARCHIVE_PATH" >&2
            exit 1
          }

          unpack_dir="$(mktemp -d "$RUNNER_TEMP/hugo-starter.XXXXXX")"
          trap 'rm -rf -- "$unpack_dir"' EXIT

          # Extract first, so the source archive remains available during cleanup.
          unzip -q "$GITHUB_WORKSPACE/$ARCHIVE_PATH" -d "$unpack_dir"

          site_root="$(find "$unpack_dir" -type f -path '*/site/hugo.toml' -print -quit | xargs -r dirname)"
          [[ -n "$site_root" && -f "$site_root/hugo.toml" ]] || {
            echo "The ZIP does not contain site/hugo.toml" >&2
            exit 1
          }

          # Remove every repository item except Git metadata and the source ZIP.
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name "$ARCHIVE_PATH" \
            -exec rm -rf -- {} +

          # Install the new Hugo site at the repository root.
          cp -a "$site_root/." "$GITHUB_WORKSPACE/"
          rm -- "$GITHUB_WORKSPACE/$ARCHIVE_PATH"

          git add --all

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name '0xC0000005'
          git config user.email 'noreply@github.com'
          git commit -m 'Install 0xC0000005 Hugo blog'
          git push origin "HEAD:$GITHUB_REF_NAME"
