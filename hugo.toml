baseURL = 'https://kxenon0rix.github.io/'
locale = 'en-US'
defaultContentLanguage = 'en-us'
title = '0xC0000005 · Personal Journal'
theme = 'gilded-page'
publishDir = 'dist'
enableRobotsTXT = true
summaryLength = 36

[taxonomies]
  category = 'categories'
  tag = 'tags'

[outputs]
  home = ['html']
  page = ['html']
  section = ['html']
  taxonomy = ['html']
  term = ['html']

[pagination]
  pagerSize = 6
  path = 'page'

[permalinks]
  articles = '/articles/:slug/'

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      strikethrough = false
      [markup.goldmark.extensions.extras]
        [markup.goldmark.extensions.extras.delete]
          enable = true
        [markup.goldmark.extensions.extras.insert]
          enable = true
        [markup.goldmark.extensions.extras.mark]
          enable = true
        [markup.goldmark.extensions.extras.subscript]
          enable = true
        [markup.goldmark.extensions.extras.superscript]
          enable = true
      [markup.goldmark.extensions.footnote]
        enable = true
        backlinkHTML = '↩︎'
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\[', '\]']]
          inline = [['\(', '\)'], ['$', '$']]
    [markup.goldmark.parser.attribute]
      block = true
      title = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    noClasses = false
    style = 'github'
    tabWidth = 2

[params]
  author = '0xC0000005'
  slogan = 'Beyond the obvious.'
  description = 'A journal of errors, ideas, travel, books, and everyday life.'
  dateFormat = 'January 2, 2006'
  mermaidVersion = '11'
  math = true
  katexVersion = '0.16.11'
