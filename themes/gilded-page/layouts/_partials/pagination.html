{{ with .Paginator }}{{ if gt .TotalPages 1 }}<nav class="mt-5" aria-label="文章分页"><ul class="pagination justify-content-center">{{ if .HasPrev }}<li class="page-item"><a class="page-link page-turn-link" href="{{ .Prev.URL }}" aria-label="上一页">←</a></li>{{ end }}{{ if .HasNext }}<li class="page-item"><a class="page-link page-turn-link" href="{{ .Next.URL }}" aria-label="下一页">→</a></li>{{ end }}</ul></nav>{{ end }}{{ end }}
