<article class="col-md-6 col-lg-4 story-card"><a class="page-turn-link" href="{{ .RelPermalink }}"><div class="story-img {{ .Params.photo | default "photo-olive" }}"></div><div class="card-meta"><span>{{ range $i, $c := .Params.categories }}{{ if $i }} · {{ end }}{{ partial "category-label.html" $c }}{{ end }}</span><span>{{ .Date.Format "01.02.2006" }}</span></div><h3>{{ .Title }}</h3><p>{{ .Description | default .Summary | plainify | truncate 92 }}</p><span class="byline">By <b>{{ site.Params.author }}</b> · Reading {{ .ReadingTime }} min</span></a></article>
