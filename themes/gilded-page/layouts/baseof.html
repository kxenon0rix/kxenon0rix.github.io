<!doctype html>
<html lang="{{ site.Language.Locale }}">
  {{ partial "head.html" . }}
  <body{{ if site.Params.themeClass }} class="{{ site.Params.themeClass }}"{{ end }}>
    <script>try{if(localStorage.getItem('journal-theme')==='dark')document.body.classList.add('dark')}catch(e){}</script>
    {{ partial "header.html" . }}
    <main class="page-content">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
    <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="siteToast" class="toast"><div class="toast-body" id="toastMessage">已收藏</div></div></div>
    <button id="backTop" class="back-top" aria-label="回到顶部">↑</button>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {{ if or .Params.mermaid .Params.math }}<script src="https://cdn.jsdelivr.net/npm/mermaid@{{ site.Params.mermaidVersion }}/dist/mermaid.min.js"></script>{{ end }}
    {{ if .Params.math }}<script defer src="https://cdn.jsdelivr.net/npm/katex@{{ site.Params.katexVersion }}/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@{{ site.Params.katexVersion }}/dist/contrib/auto-render.min.js"></script>{{ end }}
    <script src="{{ "js/site.js" | relURL }}"></script>
  </body>
</html>
