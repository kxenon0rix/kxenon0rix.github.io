{{ with .Paginator }}
{{ if gt .TotalPages 1 }}
<nav class="pagination" aria-label="文章分页">
  {{ with .Prev }}<a href="{{ .URL }}" aria-label="上一页">←</a>{{ end }}
  {{ range .Pagers }}
    {{ if eq .PageNumber $.Paginator.PageNumber }}<span class="current" aria-current="page">{{ .PageNumber }}</span>{{ else }}<a href="{{ .URL }}">{{ .PageNumber }}</a>{{ end }}
  {{ end }}
  {{ with .Next }}<a href="{{ .URL }}" aria-label="下一页">→</a>{{ end }}
  <span class="spacer"></span><span>{{ .PageNumber }} / {{ .TotalPages }}</span>
</nav>
{{ end }}
{{ end }}
